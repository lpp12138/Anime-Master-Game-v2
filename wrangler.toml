name = "anime-master-game-api"
main = "worker/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "ROOM_OBJECTS"
class_name = "RoomDurableObject"

[[durable_objects.bindings]]
name = "ROOM_OBJECTS_V3"
class_name = "RoomDurableObjectV3"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RoomDurableObjectV3"]

[[d1_databases]]
binding = "DB"
database_name = "anime_master_game"
database_id = "29c5a6af-b096-4be0-934d-67fbcc0a0520"
migrations_dir = "d1/migrations"

[[r2_buckets]]
binding = "IMAGE_BUCKET"
bucket_name = "anime-master-game-images"

[triggers]
crons = ["0 23 * * *"]

[vars]
ALLOWED_ORIGIN = "https://caicai.lpp.moe,http://localhost:3000"
R2_IMAGE_PREFIX = "question-images"
R2_PUBLIC_BASE_URL = "https://caicai.lpp.moe/api/r2-images"
R2_EXISTING_IMAGE_LIMIT = "50"
REMOTE_IMAGE_PROXY_CANDIDATES = "https://corsproxy.io/?url=,https://api.allorigins.win/raw?url=,https://api.codetabs.com/v1/proxy?quest="

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
